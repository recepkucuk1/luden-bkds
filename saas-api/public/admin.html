<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>BRY Takip — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { DEFAULT: '#0f6e56', dark: '#0a4734' } } } },
    };
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- ════ Auth screen ════ -->
  <div id="authScreen" class="min-h-screen flex items-center justify-center px-5">
    <div class="bg-white rounded-2xl p-7 shadow-sm w-full max-w-md">
      <h1 class="text-xl font-semibold mb-2">BRY Takip Admin</h1>
      <p class="text-sm text-gray-600 mb-5">Admin token girin.</p>
      <input id="tokenInput" type="password" placeholder="ADMIN_TOKEN"
             class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-brand/30 focus:bg-white" />
      <button onclick="login()" class="w-full mt-4 py-2.5 bg-brand text-white text-sm font-medium rounded-xl hover:bg-brand-dark transition-colors">
        Giriş
      </button>
      <p id="authError" class="hidden mt-3 text-xs text-red-700 bg-red-50 rounded-lg p-2"></p>
    </div>
  </div>

  <!-- ════ Admin dashboard ════ -->
  <div id="dashboard" class="hidden">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
      <div class="max-w-7xl mx-auto px-5 h-14 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-white font-semibold">↘</div>
          <h1 class="font-semibold">BRY Takip — Admin</h1>
        </div>
        <button onclick="logout()" class="text-sm text-gray-600 hover:text-gray-900">Çıkış</button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-5 py-6">
      <!-- Filtre bar -->
      <div class="bg-white border border-gray-200 rounded-xl p-3 flex flex-wrap items-center gap-3 mb-4">
        <input id="searchInput" type="text" placeholder="Ara: ad / email / telefon / şehir"
               class="flex-1 min-w-[200px] px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30"
               oninput="debouncedFetch()" />
        <select id="planFilter" onchange="fetchKurums()" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm">
          <option value="">Tüm planlar</option>
          <option value="LITE">Lite</option>
          <option value="STANDART">Standart</option>
          <option value="PRO">Pro</option>
        </select>
        <button onclick="fetchKurums()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-sm font-medium rounded-lg">
          Yenile
        </button>
        <span id="totalCount" class="text-xs text-gray-500 ml-auto">—</span>
      </div>

      <!-- Tablo -->
      <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200 text-xs text-gray-600 uppercase tracking-wider">
              <tr>
                <th class="text-left p-3">Kurum</th>
                <th class="text-left p-3">Yetkili</th>
                <th class="text-left p-3">İletişim</th>
                <th class="text-left p-3">Plan</th>
                <th class="text-left p-3">Lisans</th>
                <th class="text-left p-3">Son ödeme</th>
                <th class="text-left p-3">Kayıt</th>
                <th class="text-right p-3">İşlem</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="hidden p-8 text-center text-sm text-gray-500">
          Henüz kayıt yok.
        </div>
      </div>
    </main>
  </div>

  <!-- ════ License Issue Modal ════ -->
  <div id="licenseModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-5">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full">
      <h2 class="text-lg font-semibold mb-2">Lisans Üret</h2>
      <p id="licenseModalKurum" class="text-sm text-gray-600 mb-4">—</p>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Süre (gün)</label>
          <input id="licenseDays" type="number" value="365" min="1" max="3650"
                 class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-brand/30" />
          <p class="text-[11px] text-gray-500 mt-1">365 = 1 yıl, 30 = 1 ay, 14 = 2 hafta deneme</p>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Durum</label>
          <div class="flex gap-2">
            <label class="flex-1">
              <input type="radio" name="licStatus" value="ACTIVE" checked class="peer sr-only" />
              <div class="px-3 py-2 text-center text-sm border border-gray-200 rounded-lg peer-checked:border-brand peer-checked:bg-brand/10 peer-checked:text-brand cursor-pointer">
                Aktif
              </div>
            </label>
            <label class="flex-1">
              <input type="radio" name="licStatus" value="PENDING" class="peer sr-only" />
              <div class="px-3 py-2 text-center text-sm border border-gray-200 rounded-lg peer-checked:border-brand peer-checked:bg-brand/10 peer-checked:text-brand cursor-pointer">
                Bekleyen
              </div>
            </label>
          </div>
        </div>
      </div>

      <div id="licenseResult" class="hidden mt-4 p-3 bg-brand/10 border border-brand/30 rounded-lg">
        <p class="text-xs text-brand mb-1">Lisans kodu üretildi:</p>
        <code id="licenseKeyOutput" class="block bg-white border border-gray-200 rounded-lg p-2 text-sm font-mono text-gray-900 select-all"></code>
        <p class="text-[11px] text-gray-600 mt-2">Bu kodu kurumun mail/WhatsApp'ına gönder. Geçerlilik: <span id="licenseExpiry">—</span></p>
      </div>

      <div class="flex gap-2 mt-5">
        <button id="licenseSubmit" onclick="submitLicense()" class="flex-1 py-2 bg-brand text-white text-sm font-medium rounded-lg hover:bg-brand-dark">
          Üret
        </button>
        <button onclick="closeLicenseModal()" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-lg hover:bg-gray-200">
          Kapat
        </button>
      </div>
    </div>
  </div>

  <!-- ════ Payment Modal ════ -->
  <div id="paymentModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-5">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full">
      <h2 class="text-lg font-semibold mb-2">Ödeme Kaydı Ekle</h2>
      <p id="paymentModalKurum" class="text-sm text-gray-600 mb-4">—</p>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Tutar (₺)</label>
          <input id="paymentAmount" type="number" placeholder="299" step="0.01"
                 class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-mono" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Yöntem</label>
          <select id="paymentMethod" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm">
            <option value="HAVALE">Havale / EFT</option>
            <option value="IYZICO">iyzico</option>
            <option value="MANUEL">Manuel</option>
            <option value="OTHER">Diğer</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Notlar (opsiyonel)</label>
          <textarea id="paymentNotes" rows="2" placeholder="e-Fatura no, dekont referansı vb."
                    class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm"></textarea>
        </div>
      </div>
      <div class="flex gap-2 mt-5">
        <button onclick="submitPayment()" class="flex-1 py-2 bg-brand text-white text-sm font-medium rounded-lg hover:bg-brand-dark">
          Kaydet
        </button>
        <button onclick="closePaymentModal()" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-lg hover:bg-gray-200">
          Kapat
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost'
      ? 'http://localhost:3000'
      : '';
    const TOKEN_KEY = 'brytakip-admin-token';

    let currentKurumId = null;
    let kurumMap = new Map();  // id → kurum object

    // ────── Auth ──────
    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
    function clearToken() { localStorage.removeItem(TOKEN_KEY); }

    function authHeader() {
      const t = getToken();
      return t ? { 'Authorization': `Bearer ${t}` } : {};
    }

    async function login() {
      const t = document.getElementById('tokenInput').value.trim();
      const err = document.getElementById('authError');
      err.classList.add('hidden');
      if (!t) { err.textContent = 'Token girin'; err.classList.remove('hidden'); return; }
      // Token doğrulamasını /admin/kurums çağrısı ile yap
      setToken(t);
      const ok = await fetchKurums({ silent: true });
      if (ok) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
      } else {
        clearToken();
        err.textContent = 'Token geçersiz veya sunucu hatası';
        err.classList.remove('hidden');
      }
    }

    function logout() {
      if (!confirm('Çıkış yapılsın mı?')) return;
      clearToken();
      location.reload();
    }

    // ────── Fetch kurums ──────
    let fetchTimer;
    function debouncedFetch() {
      clearTimeout(fetchTimer);
      fetchTimer = setTimeout(fetchKurums, 300);
    }

    async function fetchKurums(opts = {}) {
      const q = document.getElementById('searchInput')?.value.trim() || '';
      const plan = document.getElementById('planFilter')?.value || '';
      const params = new URLSearchParams();
      if (q) params.set('q', q);
      if (plan) params.set('plan', plan);
      params.set('limit', '100');

      try {
        const r = await fetch(`${API_BASE}/api/admin/kurums?${params}`, {
          headers: authHeader(),
        });
        if (!r.ok) {
          if (!opts.silent) console.error('fetch kurums failed:', r.status);
          return false;
        }
        const data = await r.json();
        renderTable(data);
        return true;
      } catch (ex) {
        if (!opts.silent) console.error(ex);
        return false;
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tbody');
      const empty = document.getElementById('emptyState');
      const total = document.getElementById('totalCount');

      total.textContent = `Toplam: ${data.total}`;
      kurumMap.clear();

      if (data.kurums.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      tbody.innerHTML = data.kurums.map(k => {
        kurumMap.set(k.id, k);
        const lastLicense = k.licenses?.[0];
        const lastPayment = k.payments?.[0];
        const planColor = { LITE: 'bg-gray-100 text-gray-700', STANDART: 'bg-brand/10 text-brand', PRO: 'bg-amber-100 text-amber-800' }[k.plan];
        const licStatus = lastLicense
          ? `<span class="text-xs">${lastLicense.status}</span><br><span class="text-[10px] text-gray-500">${new Date(lastLicense.expiresAt).toLocaleDateString('tr')}</span>`
          : '<span class="text-xs text-gray-400">—</span>';
        const payment = lastPayment
          ? `<span class="text-xs">${Number(lastPayment.amount).toLocaleString('tr')}₺</span><br><span class="text-[10px] text-gray-500">${new Date(lastPayment.paidAt || lastPayment.createdAt).toLocaleDateString('tr')}</span>`
          : '<span class="text-xs text-gray-400">—</span>';
        return `
          <tr class="border-b border-gray-100 hover:bg-gray-50">
            <td class="p-3">
              <div class="font-medium">${escape(k.ad)}</div>
              <div class="text-[11px] text-gray-500">${escape(k.sehir)}</div>
            </td>
            <td class="p-3 text-xs">${escape(k.yetkili)}</td>
            <td class="p-3 text-xs">
              <div>${escape(k.email)}</div>
              <div class="text-gray-500">${escape(k.telefon)}</div>
            </td>
            <td class="p-3"><span class="px-2 py-0.5 text-[10px] font-medium rounded-full ${planColor}">${k.plan}</span></td>
            <td class="p-3">${licStatus}</td>
            <td class="p-3">${payment}</td>
            <td class="p-3 text-xs text-gray-500">${new Date(k.createdAt).toLocaleDateString('tr')}</td>
            <td class="p-3 text-right">
              <button onclick="openLicenseModal('${k.id}')" class="text-xs px-2 py-1 bg-brand/10 text-brand rounded font-medium hover:bg-brand/20">
                Lisans
              </button>
              <button onclick="openPaymentModal('${k.id}')" class="text-xs px-2 py-1 bg-amber-50 text-amber-700 rounded font-medium hover:bg-amber-100">
                Ödeme
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function escape(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    // ────── License Modal ──────
    function openLicenseModal(kurumId) {
      currentKurumId = kurumId;
      const k = kurumMap.get(kurumId);
      document.getElementById('licenseModalKurum').textContent = `${k.ad} (${k.plan})`;
      document.getElementById('licenseDays').value = '365';
      document.getElementById('licenseResult').classList.add('hidden');
      document.getElementById('licenseSubmit').disabled = false;
      document.getElementById('licenseSubmit').textContent = 'Üret';
      document.getElementById('licenseModal').classList.remove('hidden');
    }
    function closeLicenseModal() {
      document.getElementById('licenseModal').classList.add('hidden');
      currentKurumId = null;
      fetchKurums(); // listeyi tazele
    }

    async function submitLicense() {
      const btn = document.getElementById('licenseSubmit');
      const days = parseInt(document.getElementById('licenseDays').value);
      const status = document.querySelector('input[name="licStatus"]:checked').value;
      btn.disabled = true;
      btn.textContent = 'Üretiliyor...';
      try {
        const r = await fetch(`${API_BASE}/api/license/issue`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeader() },
          body: JSON.stringify({ kurumId: currentKurumId, expiresInDays: days, status }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Üretilemedi');
        document.getElementById('licenseKeyOutput').textContent = data.license.key;
        document.getElementById('licenseExpiry').textContent = new Date(data.license.expiresAt).toLocaleString('tr');
        document.getElementById('licenseResult').classList.remove('hidden');
        btn.textContent = 'Üretildi ✓';
      } catch (ex) {
        alert('Hata: ' + ex.message);
        btn.disabled = false;
        btn.textContent = 'Üret';
      }
    }

    // ────── Payment Modal ──────
    function openPaymentModal(kurumId) {
      currentKurumId = kurumId;
      const k = kurumMap.get(kurumId);
      document.getElementById('paymentModalKurum').textContent = `${k.ad} (${k.plan})`;
      document.getElementById('paymentAmount').value = k.plan === 'STANDART' ? '299' : k.plan === 'PRO' ? '599' : '0';
      document.getElementById('paymentMethod').value = 'HAVALE';
      document.getElementById('paymentNotes').value = '';
      document.getElementById('paymentModal').classList.remove('hidden');
    }
    function closePaymentModal() {
      document.getElementById('paymentModal').classList.add('hidden');
      currentKurumId = null;
      fetchKurums();
    }

    async function submitPayment() {
      const amount = parseFloat(document.getElementById('paymentAmount').value);
      const method = document.getElementById('paymentMethod').value;
      const notes = document.getElementById('paymentNotes').value.trim();
      try {
        const r = await fetch(`${API_BASE}/api/admin/payment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeader() },
          body: JSON.stringify({ kurumId: currentKurumId, amount, method, notes }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Kaydedilemedi');
        closePaymentModal();
        alert('Ödeme kaydedildi.');
      } catch (ex) {
        alert('Hata: ' + ex.message);
      }
    }

    // ────── Init ──────
    document.addEventListener('DOMContentLoaded', async () => {
      if (getToken()) {
        const ok = await fetchKurums({ silent: true });
        if (ok) {
          document.getElementById('authScreen').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
        } else {
          // Eski token geçersiz olmuş — auth ekranını göster
          clearToken();
        }
      }
    });
  </script>
</body>
</html>
