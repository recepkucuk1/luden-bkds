[package]
name = "brytakip-desktop"
version = "0.7.1"
description = "BRY Takip Desktop"
authors = ["Luden"]
edition = "2021"

[lib]
name = "brytakip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Beyaz ekran bekçisi: WebView2 profilinden yalnız HTTP önbelleği + service
# worker'ları silmek için (localStorage'daki lisans anahtarı korunur).
# Sürümler wry'nin kullandıklarıyla aynı — Cargo.lock'a yeni crate eklenmez.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
