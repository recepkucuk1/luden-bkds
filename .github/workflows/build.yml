name: Build Tauri App

# Tetikleyiciler
on:
  # Manuel tetikleme (Actions sekmesinden Run workflow butonu)
  workflow_dispatch:
  # v* ile başlayan tag push edilince otomatik release
  push:
    tags:
      - 'v*'
  # main branch'e push olunca da derle (release oluşturmaz, sadece test)
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      # Bir platform fail etse diğeri devam etsin
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon
            target: 'aarch64-apple-darwin'
            arch: 'aarch64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    # Tauri imzalama key'leri — GitHub repo secrets'a eklendiğinde build artifact'leri imzalar.
    # Auto-updater bu imzayla doğrulama yapar; imzalı olmayan binary'i kabul etmez.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      # ───── Checkout ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v5

      # ───── Node.js ──────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ───── Rust (Tauri için) ───────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ───── Rust cache ───────────────────────────────────────
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      # ───── Backend dependencies ─────────────────────────────
      - name: Install backend deps
        run: |
          cd backend
          npm ci

      # ───── Frontend dependencies ────────────────────────────
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      # ───── Desktop dependencies ─────────────────────────────
      - name: Install desktop deps
        run: |
          cd desktop
          npm ci

      # ───── Backend bundle ───────────────────────────────────
      - name: Build backend bundle
        run: |
          cd desktop
          npm run build:backend

      # ───── Frontend static export ───────────────────────────
      - name: Build frontend
        run: |
          cd desktop
          npm run build:frontend

      # ───── Node.js binary'sini bundle'a kopyala ────────────
      - name: Copy Node binary into bundle
        run: |
          cd desktop
          npm run build:node

      # ───── Tauri build (imzalama env var'ları aktarır) ─────
      - name: Build Tauri app
        run: |
          cd desktop
          npx tauri build --target ${{ matrix.target }}

      # ───── Artifacts: Mac (.dmg + .app.tar.gz + .sig) ──────
      # Tauri imzalama açıkken `.app.tar.gz` (auto-updater için) ve `.sig` üretilir.
      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v5
        with:
          name: macos-build
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

      # ───── Artifacts: Windows (.msi + .exe + .sig) ──────────
      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────
  # Release job: tüm matrix build'leri bittikten sonra
  # latest.json (Tauri updater manifest) üretip Release'e yükler.
  # ───────────────────────────────────────────────────────────
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # GitHub Actions default token READ-only çalışıyor; release oluşturmak için
    # explicit write izni vermek lazım. Aksi halde softprops/action-gh-release
    # "Resource not accessible by integration" döner.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Generate updater manifest (latest.json)
        run: node .github/scripts/build-manifest.js artifacts ${{ github.ref_name }} > latest.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Show manifest (debug)
        run: cat latest.json

      - name: Create GitHub Release
        # Glob patterns recursive (`**/*`) — Tauri 2 bundle çıktıları
        # alt klasörlerde: dmg/, macos/, msi/, nsis/.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-build/**/*
            artifacts/windows-build/**/*
            latest.json
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
